<html lang="es">
<head>

    <title>Registro || Alke Wallet</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header class="d-flex justify-content-center">
        <h1 class="text-center">Crea una cuenta en Alke Wallet</h1>
    </header>

    <main id ="register">
            <div class="container text-center">
        <div class="form">
            <h2> Registro de usuario</h2>
            <form action=""> 
            </form>

            <form id="form-registro">
            <!-- Mensaje -->
            <div id="mensaje"> </div>

                    <h2 class="h3 mb-3 fw-normal">Ingresa tus datos</h2>
                    <div class="form-floating"> 
                    <!-- Nombre -->
                    <input type="text" name="nombre" class="form-control" id="nombre" placeholder="name@example.com"> 
                    <label for="floatingNombre">Nombre Completo</label> 
                    </div>
                    <!-- Usuario -->
                    <div class="form-floating"> 
                    <input type="text" class="form-control" name="usuario" id="usuario"
                            placeholder="Password"> <label for="floatingUsuario">Usuario</label> 
                    </div>
                    <!-- Password -->
                    <div class="form-floating"> 
                    <input type="password" class="form-control" name="password" id="password"
                            placeholder="Password"> <label for="floatingPassword">Password</label> 
                    </div>
                    <!-- Confirmar Password -->
                    <div class="form-floating"> 
                    <input type="password" class="form-control" name="confirmarPassword" id="confirmarPassword"
                            placeholder="confirmarPassword"> <label for="confirmarPassword">Confirmar Password</label> 
                    </div>
                    <div>
                    <a href="menu.html">
                    <button class="btn btn-primary w-100 py-2" type="button">Registrarse</button>
                    </div>
                    </a>
                </form> 
        </div>
        </div>
        <div class="pt-5 text-center">
        <p>¿Ya tienes una cuenta en Alka Wallet? <a href="login.html"> Inicia sesión aquí</a></p>
        </div>
    </main>


    <!--Footer-->
    <div class="container text-center">
        <footer class="py-3 my-4">
